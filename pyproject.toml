[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-interface-docker"
# NOT the published version. The release workflow overwrites this from the
# release tag (`uv version --frozen`), so the tag and the artifact cannot
# disagree. This value only matters for local installs -- do not hand-bump it
# before tagging; that manual step is what broke keelson's own release 0.5.4.
version = "0.1.0"
description = "Keelson RPC responder exposing host container control (container_control/v1)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "RISE Maritime" }]
dependencies = [
    # Exact, from PyPI. The RPC key shape is a wire contract, not a compatible
    # range, and the sibling repos pin the same way (chart-server: keelson==0.6.0rc13).
    "keelson==0.6.0rc14",
    # Kept in step with the deployed router (eclipse/zenoh:1.9.0 in
    # keelson-router/docker-compose.keelson-router-rise.yml) to avoid
    # wire-protocol drift.
    "eclipse-zenoh==1.9.0",
    "docker>=7.1,<8",
    # Floor, not a ceiling: the committed *_pb2 declare gencode 6.30.2 and
    # protobuf's runtime-version gate rejects a runtime OLDER than its gencode.
    # Newer majors are explicitly allowed -- keelson 0.6.0rc14 resolves protobuf
    # 7.x today and its own stubs are generated by the same protoc.
    "protobuf>=6.30.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Exactly pinned, and to the generator keelson itself uses: protoc >= 5.27
# embeds its own version into the generated runtime-version gate, so an
# unpinned generator makes the CI proto-drift check flap on every release.
proto = ["protoc-wheel-0==30.2"]

[project.scripts]
keelson-interface-docker = "keelson_interface_docker.app:main"
container-control-cli = "keelson_interface_docker.cli:main"
container-control-healthcheck = "keelson_interface_docker.health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# *.desc is the protobuf descriptor set the subject registry decodes with.
# Omitting it here is invisible in a dev checkout (where interfaces/ exists at
# the repo root) and a startup FileNotFoundError in the image.
keelson_interface_docker = ["interfaces/*.yaml", "interfaces/*.pyi", "interfaces/*.desc"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated by protoc and committed verbatim. Excluded from BOTH the linter and
# the formatter -- `ruff format` rewriting them would put the tree permanently
# at odds with scripts/generate_protos.sh, and the CI proto-drift job would fail
# on a clean checkout.
extend-exclude = ["src/keelson_interface_docker/interfaces/ContainerControl_pb2.py*"]

[tool.ruff.lint]
# Explicit, so a lint run does not depend on whatever ruff configuration happens
# to be discoverable above the checkout -- CI and a developer's machine must
# agree about what "clean" means.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip("zenoh") has to run before the imports that need it.
"tests/test_rpc_e2e.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no network, no daemon, no bus",
    "e2e: opens a real Zenoh session and/or spawns the process; opt-in via RUN_E2E=1",
    "slow: takes more than a few seconds (waits out a shutdown window)",
]

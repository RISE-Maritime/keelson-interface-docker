name: Release

on:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # The platforms this runs on include arm64 SBCs.
          platforms: linux/amd64,linux/arm64
          # The org is rise-maritime. This was hard-coded to ghcr.io/mo-rise/...
          # until 2026-08; that :latest is frozen at the 2023 image and nothing
          # auto-upgrades off it, so every deployment must be repointed by hand.
          tags: |
            ghcr.io/rise-maritime/keelson-interface-docker:latest
            ghcr.io/rise-maritime/keelson-interface-docker:${{ github.event.release.tag_name }}
      - run: echo ${{ steps.docker_build.outputs.digest }}

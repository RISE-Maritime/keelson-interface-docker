### Well-known RPC interfaces served by this repo ###
#
# Same shape as keelson's own messages/interfaces.yaml. Loaded at startup with
# keelson.add_well_known_interfaces() so construct_rpc_key() stops warning that
# container_control/v1 is not well known.
#
# THIS FILE IS THE UPSTREAMING UNIT: when ContainerControl.proto moves into the
# keelson monorepo, this line moves into keelson's messages/interfaces.yaml and
# this file is deleted. See README -> "Upstreaming this interface into keelson".

container_control/v1: keelson.interfaces.container_control.ContainerControl
